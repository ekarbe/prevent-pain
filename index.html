<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--head-->
    <title>Prevent Pain</title>
    <meta
      data-head
      name="description"
      content="Tap where running hurts, check the weak links in your chain with 30-second self-tests, and get a strength plan. In English and German."
    />
    <!--/head-->
    <link rel="icon" type="image/svg+xml" href="/prevent-pain.svg" />
    <meta name="theme-color" content="#f1f5f1" />
    <script>
      // Apply the saved or system colour scheme before first paint, so dark mode doesn't flash.
      // Storage can be blocked; the system setting still applies then.
      var saved = null;
      try {
        saved = localStorage.getItem("theme");
      } catch (e) {}
      var dark = saved
        ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) {
        document.documentElement.classList.add("dark");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "#0f1715");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Picking a spot and the self-tests need JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
